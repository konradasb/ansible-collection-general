---
# The command line needs no systemd, so each platform is the distribution's
# own image, with Python.
driver:
  name: docker

platforms:
  - name: debian-12
    image: debian:12
    dockerfile: Dockerfile.j2
    pre_build_image: false
  - name: ubuntu-24.04
    image: ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
  - name: fedora
    image: fedora:latest
    dockerfile: Dockerfile.j2
    pre_build_image: false
  - name: rocky-9
    image: rockylinux/rockylinux:9
    dockerfile: Dockerfile.j2
    pre_build_image: false
  - name: opensuse-tumbleweed
    image: opensuse/tumbleweed
    dockerfile: Dockerfile.j2
    pre_build_image: false

provisioner:
  name: ansible

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
