---
- name: Prepare
  hosts: all
  tasks:
    # apt and deb822_repository need them in check mode, which the images
    # lack.
    - name: Install python3-apt and python3-debian
      ansible.builtin.apt:
        name:
          - python3-apt
          - python3-debian
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Make a CA and a server certificate signed by it
      ansible.builtin.shell:
        cmd: |
          set -e
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout ca-key.pem -out ca.pem -days 1 -subj /CN=molecule-ca
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout server-key.pem -out server.csr -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem \
            -CAcreateserial -out server.pem -days 1 -extfile server.ext
        chdir: /root
        creates: /root/server.pem
